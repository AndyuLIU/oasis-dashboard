<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oásis 財報儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --font-heading: "Caprasimo", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5ead8; font-family: var(--font-body); }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; margin: 0; }
  .num { font-family: 'Figtree', var(--font-body); font-variant-numeric: tabular-nums lining-nums; font-feature-settings: 'tnum' 1; letter-spacing: -0.015em; }
  a { color: #c67139; text-underline-offset: 3px; }
  a:hover { color: #8c491a; }
  .btn { font-family: var(--font-heading); font-weight: 400; border: 0; cursor: pointer; }
  .btn-primary { background: #c67139; color: #f5ead8; }
  .btn-primary:hover { background: #8c491a; }
  .table { width: 100%; border-collapse: collapse; font-size: 15px; }
  @page { size: A4 landscape; margin: 10mm; }
  @media print { .no-print { display: none !important; } }

  .mobile-topbar { display: none; }
  .hamburger-btn, .sidebar-close-btn { display: none; }
  .sidebar-overlay { display: none; }

  @media (max-width: 760px) {
    .app-shell { flex-direction: column; }
    .mobile-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; background: #ebddc5; position: sticky; top: 0; z-index: 20;
    }
    .hamburger-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px; background: #dcd3c4; border: 0; cursor: pointer; flex: 0 0 auto;
    }
    .sidebar {
      position: fixed !important; top: 0 !important; left: 0 !important;
      height: 100vh !important; width: 82vw !important; max-width: 300px;
      z-index: 40; transform: translateX(-100%); transition: transform 220ms ease;
      box-shadow: 2px 0 18px rgba(0,0,0,0.18);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-close-btn {
      display: flex !important; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 999px; background: #dcd3c4; border: 0; cursor: pointer; flex: 0 0 auto;
    }
    .sidebar-overlay {
      display: block; position: fixed; inset: 0; background: rgba(32,30,29,0.45); z-index: 30;
      opacity: 0; pointer-events: none; transition: opacity 220ms ease;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
    .main-content { padding: 20px 16px 60px !important; }
    .header-row { align-items: flex-start !important; }
    .header-meta { text-align: left !important; }
    #title { font-size: 30px !important; }
    #subtitle { font-size: 14px !important; }
    #kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important; }
    .chart-scroll { overflow-x: auto; }
    .chart-scroll svg { min-width: 640px; }
  }
</style>
</head>
<body>

<div class="app-shell" style="display: flex; align-items: stretch; min-height: 100vh; background: #f5ead8; color: #201e1d; font-family: var(--font-body);">

  <div class="mobile-topbar no-print">
    <img src="assets/oasis-logo-dark.png" alt="oásis" style="width: 118px; height: auto; display: block;">
    <button type="button" class="hamburger-btn no-print" id="btn-menu-open" aria-label="開啟選單">
      <svg width="20" height="14" viewBox="0 0 20 14"><g stroke="#201e1d" stroke-width="2" stroke-linecap="round"><line x1="0" y1="1" x2="20" y2="1"></line><line x1="0" y1="7" x2="20" y2="7"></line><line x1="0" y1="13" x2="20" y2="13"></line></g></svg>
    </button>
  </div>
  <div class="sidebar-overlay no-print" id="sidebar-overlay"></div>

  <div class="no-print sidebar" style="width: 268px; flex: 0 0 268px; background: #ebddc5; padding: 30px 22px 40px; display: flex; flex-direction: column; gap: 34px; position: sticky; top: 0; align-self: flex-start; height: 100vh; box-sizing: border-box; overflow-y: auto;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
      <div>
        <img src="assets/oasis-logo-dark.png" alt="oásis" style="width: 100%; max-width: 186px; height: auto; display: block;">
        <div style="font-size: 13px; color: #645c50; margin-top: 14px; padding-left: 4px;">美髮沙龍 · 財務儀表板</div>
      </div>
      <button type="button" class="sidebar-close-btn no-print" id="btn-menu-close" aria-label="關閉選單">✕</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #82796a; padding-left: 6px; margin-bottom: 4px;">檢視範圍</div>
      <div id="nav-items" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #82796a; padding-left: 6px;">期間</div>
      <div id="period-tabs" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
      <div id="period-caption" style="font-size: 12.5px; color: #645c50; padding-left: 6px; line-height: 1.6;"></div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px;">
      <button class="btn btn-primary" type="button" id="btn-print" style="border-radius: 999px; padding: 11px 18px; width: 100%;">匯出 PDF</button>
      <div style="font-size: 11.5px; color: #82796a; line-height: 1.6;">資料每月由 n8n 自動更新；異常提醒為規則判斷，非會計意見。</div>
    </div>
  </div>

  <div class="main-content" style="flex: 1; min-width: 0; padding: 44px 56px 110px;">

    <div class="header-row" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-bottom: 34px; flex-wrap: wrap;">
      <div style="max-width: 620px;">
        <div id="scope-kicker" style="font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #82796a; margin-bottom: 12px;"></div>
        <h1 id="title" style="font-size: 50px; margin: 0 0 14px; line-height: 1.04;"></h1>
        <p id="subtitle" style="font-size: 16px; color: #645c50; margin: 0; text-wrap: pretty;"></p>
      </div>
      <div class="header-meta" style="text-align: right; font-size: 13px; color: #645c50; line-height: 1.9;">
        <div>單位：新台幣元</div>
        <div id="period-caption-2"></div>
      </div>
    </div>

    <div id="kpi-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: 14px;"></div>

    <div style="margin: 74px 0 20px;">
      <h2 style="font-size: 31px; margin: 0 0 10px;">損益明細</h2>
      <p id="table-caption" style="font-size: 15px; color: #645c50; margin: 0;"></p>
    </div>

    <div style="background: #f9f4ed; border-radius: 28px; padding: 12px 30px 20px; box-shadow: 0 1px 2px rgba(46,43,37,0.14); overflow-x: auto;">
      <table class="table">
        <thead>
          <tr>
            <th style="text-align: left; padding: 18px 12px; font-family: var(--font-heading); font-size: 14px; color: #645c50; border-bottom: 1px solid #dcd3c4;">項目</th>
            <th style="text-align: right; padding: 18px 12px; font-family: var(--font-heading); font-size: 14px; color: #645c50; border-bottom: 1px solid #dcd3c4;">本月</th>
            <th style="text-align: right; padding: 18px 12px; font-family: var(--font-heading); font-size: 14px; color: #645c50; border-bottom: 1px solid #dcd3c4;">佔營收</th>
            <th style="text-align: right; padding: 18px 12px; font-family: var(--font-heading); font-size: 14px; color: #645c50; border-bottom: 1px solid #dcd3c4;">上月</th>
            <th style="text-align: right; padding: 18px 12px; font-family: var(--font-heading); font-size: 14px; color: #645c50; border-bottom: 1px solid #dcd3c4;">累計年初至今</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 26px; margin: 74px 0 20px; flex-wrap: wrap;">
      <div>
        <h2 style="font-size: 31px; margin: 0 0 10px;">收入與支出結構</h2>
        <p id="stack-caption" style="font-size: 15px; color: #645c50; margin: 0;"></p>
      </div>
      <div id="stack-legend" style="display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13.5px;"></div>
    </div>

    <div class="chart-scroll" style="background: #f9f4ed; border-radius: 28px; padding: 30px 22px 14px; box-shadow: 0 1px 2px rgba(46,43,37,0.14);">
      <svg id="bar-svg" viewBox="0 0 1000 330" style="width: 100%; height: auto; overflow: visible; font-family: var(--font-body);"></svg>
    </div>
    <div style="font-size: 11px; color: #82796a; margin-top: 10px;">依交易明細分類，不含帳戶間轉帳沖銷；金額與月度盈虧可能有些微差異。</div>

    <div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 26px; margin: 74px 0 20px; flex-wrap: wrap;">
        <div>
          <h2 id="trend-title" style="font-size: 31px; margin: 0 0 10px;"></h2>
          <p id="trend-caption" style="font-size: 15px; color: #645c50; margin: 0;"></p>
        </div>
        <div id="trend-legend" style="display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13.5px;"></div>
      </div>
      <div class="chart-scroll" style="background: #f9f4ed; border-radius: 28px; padding: 30px 22px 14px; box-shadow: 0 1px 2px rgba(46,43,37,0.14);">
        <svg id="trend-svg" viewBox="0 0 1000 300" style="width: 100%; height: auto; overflow: visible; font-family: var(--font-body);"></svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 74px; align-items: start;">
      <div style="background: #f9f4ed; border-radius: 28px; padding: 34px 34px 30px; box-shadow: 0 1px 2px rgba(46,43,37,0.14);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;">
          <h2 style="font-size: 31px; margin: 0;">月結報告</h2>
          <span id="report-scope" style="font-size: 12.5px; letter-spacing: 0.09em; text-transform: uppercase; color: #82796a;"></span>
        </div>
        <div id="report-paras"></div>
        <div style="margin-top: 26px; padding-top: 22px; border-top: 1px solid #e4dccd; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: #82796a;">下個月建議追的三件事</div>
          <div id="actions"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: #82796a; padding: 6px 0 0 4px;" id="flag-count-label"></div>
        <div id="flags"></div>
      </div>
    </div>

  </div>
</div>

<script>
const COST_KEYS = [
  { key: 'labor', label: '人事費用', color: '#8c491a', srcGroup: '人事薪資' },
  { key: 'material', label: '材料／進貨', color: '#c67139', srcGroup: '物料成本' },
  { key: 'rent', label: '租金', color: '#f6a06b', srcGroup: '房租與固定' },
  { key: 'util', label: '水電雜支', color: '#ffc6a5', srcGroup: '日常營運' },
  { key: 'other', label: '其他營業費用', color: '#dcd3c4', srcGroup: '其他支出' }
];
const REV_COLOR = '#56633f';
const TARGET_MARGIN = 16; // 營業利益率目標（%），沿用設計稿預設值，之後可依實際目標調整
const STORE_COLORS = { mingquan: '#c67139', guanqian: '#56633f', taida: '#8c491a', baoan: '#8fa073', hq: '#6b4f8a' };

const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => Math.round(n / 1000).toLocaleString('en-US');
const pct = (n, d) => d ? (n / d * 100).toFixed(1) + '%' : '—';
const sign = (n, dp) => (n >= 0 ? '+' : '') + n.toFixed(dp == null ? 1 : dp);
const dot = c => 'width:13px;height:13px;border-radius:999px;background:' + c + ';display:inline-block;flex:0 0 13px;';

function buildSeries(store) {
  return store.monthly.map(m => {
    const catInfo = (store.categories && store.categories[String(m.month)]) || { expense_groups: [] };
    const costs = {};
    COST_KEYS.forEach(ck => { costs[ck.key] = 0; });
    (catInfo.expense_groups || []).forEach(g => {
      const ck = COST_KEYS.find(c => c.srcGroup === g.group);
      if (ck) costs[ck.key] += g.subtotal;
    });
    return { month: m.month, rev: m.income, costs, exp: m.expense, op: m.profit, nonOp: m.non_operating || 0 };
  });
}

function sumMonth(list) {
  const costs = {};
  COST_KEYS.forEach(ck => { costs[ck.key] = list.reduce((a, m) => a + m.costs[ck.key], 0); });
  return {
    rev: list.reduce((a, m) => a + m.rev, 0),
    costs,
    exp: list.reduce((a, m) => a + m.exp, 0),
    op: list.reduce((a, m) => a + m.op, 0),
    nonOp: list.reduce((a, m) => a + (m.nonOp || 0), 0)
  };
}

function sumAcrossStores(perStoreSeries, idx) {
  const rows = perStoreSeries.map(s => s[idx]).filter(Boolean);
  return sumMonth(rows);
}

function niceTicks(max, count) {
  if (!(max > 0)) return { top: 1, vals: [0, 1] };
  const step = Math.pow(10, Math.floor(Math.log10(max / count)));
  let s = step;
  [1, 2, 2.5, 5, 10].some(m => { if (step * m * count >= max) { s = step * m; return true; } return false; });
  const top = Math.ceil(max / s) * s;
  const out = [];
  for (let v = 0; v <= top + 1; v += s) out.push(v);
  return { top, vals: out };
}

const state = { scope: 'all', period: 'month', monthIndex: null };
let STORES = [];   // [{id, name, color}]
let SERIES = {};   // id -> series[]
let MONTHS = [];   // list of month numbers present (assumes shared across stores)

async function loadData() {
  const res = await fetch('./data.json', { cache: 'no-store' });
  const json = await res.json();
  STORES = json.stores.map(s => ({ id: s.id, name: s.name, color: STORE_COLORS[s.id] || '#8c491a' }));
  SERIES = {};
  json.stores.forEach(s => { SERIES[s.id] = buildSeries(s); });
  MONTHS = (json.stores[0] ? json.stores[0].monthly.map(m => m.month) : []);
  document.getElementById('period-caption').textContent = '';
  render();
}

function render() {
  const scope = state.scope, period = state.period;
  const isAll = scope === 'all';
  const store = STORES.find(s => s.id === scope);
  // 總部的收入主要是跟各店收的品牌管理費，那筆錢在各店帳上已經算過一次支出，
  // 「總覽」加總不含總部，避免同一筆內部往來被算兩次；總部仍可在側邊欄單獨點開看。
  const aggregateStores = STORES.filter(s => s.id !== 'hq');
  const perStoreSeries = aggregateStores.map(s => SERIES[s.id]);
  const series = isAll ? MONTHS.map((_, i) => sumAcrossStores(perStoreSeries, i)) : SERIES[scope];
  const last = series.length - 1;
  const monthIdx = state.monthIndex != null ? Math.min(state.monthIndex, last) : last;
  const cur = series[monthIdx];
  const prev = monthIdx > 0 ? series[monthIdx - 1] : { rev: 0, exp: 0, op: 0, nonOp: 0, costs: Object.fromEntries(COST_KEYS.map(c => [c.key, 0])) };
  const ytd = sumMonth(series); // 目前資料全落在同一年內，YTD = 累計所有已知月份
  const monthsInYtd = series.length;
  const shown = period === 'month' ? cur : ytd;
  const allLabel = aggregateStores.length + '店合計';
  const label = isAll ? allLabel : store.name;
  const curMonthLabel = MONTHS[monthIdx] + ' 月';

  // ---- sidebar nav ----
  const navEl = document.getElementById('nav-items');
  const navBase = 'display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font-family:var(--font-body);font-size:15.5px;font-weight:600;padding:12px 16px;border:0;border-radius:999px;cursor:pointer;transition:background 140ms;';
  const navList = [{ id: 'all', name: '總覽（' + allLabel + '）', rev: sumAcrossStores(perStoreSeries, last).rev }]
    .concat(STORES.map(s => ({ id: s.id, name: s.name, rev: SERIES[s.id][SERIES[s.id].length - 1].rev })));
  navEl.innerHTML = navList.map(n => {
    const on = n.id === scope;
    return `<button type="button" data-scope="${n.id}" style="${navBase}${on ? 'background:#c67139;color:#f5ead8;' : 'background:transparent;color:#201e1d;'}">
      <span>${n.name}</span>
      <span class="num" style="font-size:12.5px;font-weight:500;color:${on ? 'rgba(245,234,216,0.8)' : '#82796a'};">${fmtK(n.rev)}K</span>
    </button>`;
  }).join('');

  // ---- period tabs (每月分頁 + YTD) ----
  const monthPillBase = 'border:0;cursor:pointer;font-family:var(--font-body);font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:999px;';
  const periodTabs = MONTHS.map((mo, i) => ({ id: 'm' + i, label: mo + '月', active: period === 'month' && i === monthIdx }))
    .concat([{ id: 'ytd', label: 'YTD', active: period === 'ytd' }]);
  document.getElementById('period-tabs').innerHTML = periodTabs.map(t =>
    `<button type="button" data-period-tab="${t.id}" style="${monthPillBase}${t.active ? 'background:#c67139;color:#f5ead8;' : 'background:#dcd3c4;color:#645c50;'}">${t.label}</button>`
  ).join('');
  const periodCaption = period === 'month' ? curMonthLabel + '結' : MONTHS[0] + '–' + MONTHS[last] + ' 月累計';
  document.getElementById('period-caption').textContent = periodCaption;
  document.getElementById('period-caption-2').textContent = periodCaption;

  // ---- header ----
  document.getElementById('scope-kicker').textContent = isAll ? allLabel : '單店檢視';
  document.getElementById('title').textContent = isAll ? '總覽' : store.name;
  document.getElementById('subtitle').textContent = isAll
    ? aggregateStores.map(s => s.name).join('、') + '的收入、支出與獲利合計（不含總部）。'
    : '單店財務檢視（' + store.name + '）。';
  document.getElementById('report-scope').textContent = label + ' · ' + curMonthLabel;

  // ---- KPIs ----
  const good = '#56633f', bad = '#8c491a', muted = '#645c50';
  const card = 'background:#ebddc5;border-radius:28px;padding:26px 24px;box-shadow:0 1px 2px rgba(46,43,37,0.14);';
  const cardAccent = 'background:#ffe1d0;border-radius:28px;padding:26px 24px;box-shadow:0 1px 2px rgba(46,43,37,0.14);';
  const cardSage = 'background:#e1eecc;border-radius:28px;padding:26px 24px;box-shadow:0 1px 2px rgba(46,43,37,0.14);';
  const gross = shown.rev - shown.costs.material;
  const mgn = shown.rev ? shown.op / shown.rev * 100 : 0;
  const deltaFn = (a, b, unit) => {
    if (period === 'ytd') return '月均 ' + fmt(a / monthsInYtd) + (unit || '');
    const p = b ? (a - b) / b * 100 : 0;
    return '較上月 ' + (p >= 0 ? '+' : '') + p.toFixed(1) + '%';
  };
  const kpis = [
    { label: '營業收入', value: fmt(shown.rev), delta: deltaFn(shown.rev, prev.rev), deltaColor: (period === 'ytd' || cur.rev >= prev.rev) ? (period === 'ytd' ? muted : good) : bad, cardStyle: card, valueColor: '#201e1d', mutedColor: '#645c50' },
    { label: '毛利（收入減材料）', value: fmt(gross), delta: '毛利率 ' + pct(gross, shown.rev), deltaColor: muted, cardStyle: card, valueColor: '#201e1d', mutedColor: '#645c50' },
    { label: '營業支出', value: fmt(shown.exp), delta: '佔營收 ' + pct(shown.exp, shown.rev), deltaColor: muted, cardStyle: card, valueColor: '#201e1d', mutedColor: '#645c50' },
    { label: '營業利益', value: fmt(shown.op), delta: deltaFn(shown.op, prev.op), deltaColor: (period === 'ytd' || cur.op >= prev.op) ? (period === 'ytd' ? muted : good) : bad, cardStyle: cardAccent, valueColor: '#402310', mutedColor: '#643312' },
    { label: '營業利益率', value: mgn.toFixed(1) + '%', delta: '目標 ' + TARGET_MARGIN + '%，' + (mgn >= TARGET_MARGIN ? '已達成' : '差 ' + (TARGET_MARGIN - mgn).toFixed(1) + ' 個百分點'), deltaColor: mgn >= TARGET_MARGIN ? '#3d472b' : bad, cardStyle: mgn >= TARGET_MARGIN ? cardSage : card, valueColor: mgn >= TARGET_MARGIN ? '#272e1b' : '#201e1d', mutedColor: '#645c50' }
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
    <div style="${k.cardStyle}">
      <div style="font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: ${k.mutedColor}; margin-bottom: 16px;">${k.label}</div>
      <div class="num" style="font-weight: 700; font-size: clamp(25px, 2.5vw, 35px); line-height: 1; color: ${k.valueColor}; white-space: nowrap;">${k.value}</div>
      <div style="font-size: 13px; color: ${k.deltaColor}; margin-top: 14px;">${k.delta}</div>
    </div>`).join('');

  // ---- monthly report (rule-based, no LLM) ----
  const revChg = prev.rev ? (cur.rev - prev.rev) / prev.rev * 100 : 0;
  const opChg = prev.op ? (cur.op - prev.op) / prev.op * 100 : 0;
  const mgnPrev = prev.rev ? prev.op / prev.rev * 100 : 0;
  const expRatio = cur.rev ? cur.exp / cur.rev * 100 : 0;
  const winStart = Math.max(0, monthIdx - 5);
  const win = series.slice(winStart, monthIdx); // 當月之前最多 5 個月當基準
  const avg = fn => win.length ? win.reduce((a, m) => a + fn(m), 0) / win.length : null;
  const ratio = (m, key) => m.rev ? m.costs[key] / m.rev : 0;

  const reportParas = [];
  reportParas.push(label + ' ' + curMonthLabel + ' 營收 ' + fmt(cur.rev) + ' 元，較上月 ' + sign(revChg) + '%；支出 ' + fmt(cur.exp) + ' 元，佔營收 ' + expRatio.toFixed(1) +
    '%。營業利益 ' + fmt(cur.op) + ' 元，利益率 ' + mgn.toFixed(1) + '%，較上月的 ' + mgnPrev.toFixed(1) + '% ' +
    (mgn >= mgnPrev ? '上升 ' + (mgn - mgnPrev).toFixed(1) : '下滑 ' + (mgnPrev - mgn).toFixed(1)) + ' 個百分點，' +
    (mgn >= TARGET_MARGIN ? '已達 ' + TARGET_MARGIN + '% 的目標。' : '距 ' + TARGET_MARGIN + '% 的目標還差 ' + (TARGET_MARGIN - mgn).toFixed(1) + ' 個百分點。'));
  if (win.length) {
    reportParas.push('成本面，人事佔營收 ' + (ratio(cur, 'labor') * 100).toFixed(1) + '%（前 ' + win.length + ' 月均 ' + (avg(m => ratio(m, 'labor')) * 100).toFixed(1) +
      '%），租金 ' + (ratio(cur, 'rent') * 100).toFixed(1) + '%，材料 ' + (ratio(cur, 'material') * 100).toFixed(1) +
      '%。累計至今營收 ' + fmt(ytd.rev) + ' 元、營業利益 ' + fmt(ytd.op) + ' 元，累計利益率 ' + (ytd.rev ? (ytd.op / ytd.rev * 100).toFixed(1) : '0.0') + '%。');
  }
  if (shown.nonOp) {
    reportParas.push('另外，' + (period === 'ytd' ? '累計至今' : curMonthLabel) + '有股東分潤 ' + fmt(shown.nonOp) + ' 元，屬於股東往來、不是營業費用，已從上述營業支出與利益率中排除。');
  }
  document.getElementById('report-paras').innerHTML = reportParas.map(t => `<p style="font-size: 16.5px; line-height: 1.75; color: #3a352d; margin: 0 0 16px; text-wrap: pretty;">${t}</p>`).join('');

  // ---- flags (rule-based anomaly detection) ----
  const flags = [];
  const pushFlag = (level, title, body, meta, prio) => flags.push({ level, title, body, meta, prio: prio == null ? 5 : prio });
  if (ratio(cur, 'labor') > 0.50) pushFlag('warn', '人事佔比過高', '人事費用吃掉營收的 ' + (ratio(cur, 'labor') * 100).toFixed(1) + '%，超過 50% 的警戒線。檢查是否有排班過剩或底薪與業績脫鉤的情況。', '人事 ' + fmt(cur.costs.labor) + ' 元');
  if (ratio(cur, 'rent') > 0.13) pushFlag('warn', '租金比重偏重', '租金佔營收 ' + (ratio(cur, 'rent') * 100).toFixed(1) + '%，健康值約在 10% 以下。這間店要靠提高單店產值才能把比重壓回來。', '租金 ' + fmt(cur.costs.rent) + ' 元');
  if (win.length) {
    COST_KEYS.forEach(ck => {
      const baseR = avg(m => ratio(m, ck.key));
      if (!baseR) return;
      const curR = ratio(cur, ck.key);
      const dev = (curR - baseR) / baseR * 100;
      if (Math.abs(dev) >= 8) {
        pushFlag(Math.abs(dev) >= 14 ? 'alert' : 'warn', ck.label + (dev > 0 ? '佔比異常升高' : '佔比異常偏低'),
          ck.label + '佔營收 ' + (curR * 100).toFixed(1) + '%，前 ' + win.length + ' 個月平均為 ' + (baseR * 100).toFixed(1) + '%，' +
          (dev > 0 ? '相對營收多花了 ' + fmt(cur.rev * (curR - baseR)) + ' 元。確認是否有一次性支出被記在本月，或有重複入帳。'
            : '相對營收少了 ' + fmt(cur.rev * (baseR - curR)) + ' 元。確認是否有發票或請款單還沒入帳，帳可能記漏了。'),
          '偏離基準 ' + sign(dev, 0) + '%');
      }
    });
  }
  if (mgn < TARGET_MARGIN) pushFlag('warn', '利益率未達目標', '本月利益率 ' + mgn.toFixed(1) + '%，低於 ' + TARGET_MARGIN + '% 的目標，缺口約 ' + fmt(shown.rev * (TARGET_MARGIN - mgn) / 100) + ' 元。', '目標 ' + TARGET_MARGIN + '%', 1);
  if (isAll) {
    const worst = aggregateStores.map(s => { const m = SERIES[s.id][monthIdx]; return { s, m, mg: m.rev ? m.op / m.rev * 100 : 0 }; }).sort((a, b) => a.mg - b.mg)[0];
    if (worst.mg < TARGET_MARGIN) pushFlag(worst.mg < TARGET_MARGIN * 0.6 ? 'alert' : 'warn', worst.s.name + '拖累整體', worst.s.name + '本月利益率僅 ' + worst.mg.toFixed(1) + '%，是門市中最低。若拉到平均水準，全體營業利益可再增約 ' + fmt(worst.m.rev * (mgn - worst.mg) / 100) + ' 元。', '營收 ' + fmt(worst.m.rev) + ' 元', 0);
  }
  if (opChg > 8) pushFlag('good', '獲利改善', '營業利益較上月成長 ' + opChg.toFixed(1) + '%，成本沒有同步放大，屬於實質改善。', '利益 ' + fmt(cur.op) + ' 元');
  if (!flags.length) pushFlag('good', '本月無異常', '各項費用都落在近期的正常區間內，收入與支出的比例沒有明顯偏移。', '檢查 ' + (COST_KEYS.length + 2) + ' 項指標');

  const flagStyles = {
    alert: { cardStyle: 'background:#ffd8c4;border-radius:24px;padding:22px 24px;box-shadow:0 1px 2px rgba(46,43,37,0.14);', titleColor: '#5c2f11', bodyColor: '#5c2f11', metaColor: '#8c491a', tag: '需處理', tagStyle: 'background:#8c491a;color:#fdf1e6;font-size:11.5px;font-weight:600;letter-spacing:0.06em;padding:5px 12px;border-radius:999px;white-space:nowrap;' },
    warn: { cardStyle: 'background:#ebddc5;border-radius:24px;padding:22px 24px;box-shadow:0 1px 2px rgba(46,43,37,0.14);', titleColor: '#201e1d', bodyColor: '#474238', metaColor: '#82796a', tag: '留意', tagStyle: 'background:#dcd3c4;color:#5b5347;font-size:11.5px;font-weight:600;letter-spacing:0.06em;padding:5px 12px;border-radius:999px;white-space:nowrap;' },
    good: { cardStyle: 'background:#e1eecc;border-radius:24px;padding:22px 24px;box-shadow:0 1px 2px rgba(46,43,37,0.14);', titleColor: '#272e1b', bodyColor: '#3d472b', metaColor: '#56633f', tag: '良好', tagStyle: 'background:#56633f;color:#eff6e2;font-size:11.5px;font-weight:600;letter-spacing:0.06em;padding:5px 12px;border-radius:999px;white-space:nowrap;' }
  };
  const order = { alert: 0, warn: 1, good: 2 };
  const flagsOut = flags.sort((a, b) => order[a.level] - order[b.level]).slice(0, 5).map(f => Object.assign({ title: f.title, body: f.body, meta: f.meta }, flagStyles[f.level]));
  document.getElementById('flag-count-label').textContent = '帳務提醒 · ' + flagsOut.length + ' 項';
  document.getElementById('flags').innerHTML = flagsOut.map(f => `
    <div style="${f.cardStyle}">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
        <div style="font-family: var(--font-heading); font-size: 17px; color: ${f.titleColor};">${f.title}</div>
        <span style="${f.tagStyle}">${f.tag}</span>
      </div>
      <div style="font-size: 14.5px; line-height: 1.65; color: ${f.bodyColor};">${f.body}</div>
      <div class="num" style="font-size: 13px; color: ${f.metaColor}; margin-top: 10px;">${f.meta}</div>
    </div>`).join('');

  // ---- actions ----
  const actions = [];
  if (ratio(cur, 'labor') > 0.48) actions.push('把人事佔比壓回 48% 以下：檢視離峰時段排班，或改以業績連動的獎金結構。');
  if (isAll) actions.push('請利益率最低的分店店長帶當月費用明細來對帳，逐項確認可省與不可省。');
  else actions.push('把 ' + store.name + ' 的費用明細與其他門市平均逐項比對，找出高於平均的兩項先處理。');
  if (mgn < TARGET_MARGIN) actions.push('訂下一季的營收目標：利益率要到 ' + TARGET_MARGIN + '%，營收約需 ' + fmt(cur.exp / (1 - TARGET_MARGIN / 100)) + ' 元。');
  actions.push('核對本月大額支出的憑證與入帳月份，避免跨月重複或漏記。');
  const actionsOut = actions.slice(0, 3).map((t, i) => ({ n: String(i + 1).padStart(2, '0'), text: t }));
  document.getElementById('actions').innerHTML = actionsOut.map(a => `
    <div style="display: flex; gap: 12px; font-size: 15.5px; line-height: 1.6; color: #3a352d;">
      <span class="num" style="font-weight: 700; font-size: 14px; color: #c67139; flex: 0 0 22px;">${a.n}</span>
      <span>${a.text}</span>
    </div>`).join('');

  // ---- stacked bar chart: 收入與支出結構 ----
  const groups = isAll
    ? aggregateStores.map(s => ({ label: s.name, m: SERIES[s.id][monthIdx] }))
    : series.map((m, i) => ({ label: MONTHS[i] + ' 月', m }));
  const bMax = Math.max(...groups.map(g => Math.max(g.m.rev, g.m.exp)), 1);
  const bt = niceTicks(bMax, 4);
  const base = 254, topY = 24, h = base - topY;
  const y = v => base - v / bt.top * h;
  const barTicks = bt.vals.map(v => ({ y: y(v), ty: y(v) + 4, label: fmtK(v) + 'K' }));
  const x0 = 100, x1 = 980, gw = (x1 - x0) / groups.length;
  const bw = Math.min(58, gw * 0.30);
  const barRectsSvg = [], barLabelsSvg = [];
  groups.forEach((g, gi) => {
    const cx = x0 + gw * gi + gw / 2;
    const rx = cx - bw - 7, ex = cx + 7;
    barRectsSvg.push(`<rect x="${rx}" y="${y(g.m.rev)}" width="${bw}" height="${base - y(g.m.rev)}" rx="8" fill="${REV_COLOR}"></rect>`);
    barLabelsSvg.push(`<text x="${rx + bw / 2}" y="${y(g.m.rev) - 12}" text-anchor="middle" font-size="13.5" fill="#56633f" font-weight="600">${fmtK(g.m.rev)}K</text>`);
    let acc = 0;
    COST_KEYS.forEach(ck => {
      const v = g.m.costs[ck.key];
      const yy = y(acc + v), hh = y(acc) - y(acc + v);
      barRectsSvg.push(`<rect x="${ex}" y="${yy}" width="${bw}" height="${Math.max(hh, 1)}" rx="5" fill="${ck.color}"></rect>`);
      acc += v;
    });
    barLabelsSvg.push(`<text x="${ex + bw / 2}" y="${y(g.m.exp) - 12}" text-anchor="middle" font-size="13.5" fill="#8c491a" font-weight="600">${fmtK(g.m.exp)}K</text>`);
    barLabelsSvg.push(`<text x="${cx}" y="288" text-anchor="middle" font-size="16.5" fill="#201e1d" font-weight="600">${g.label}</text>`);
    barLabelsSvg.push(`<text x="${cx}" y="312" text-anchor="middle" font-size="13.5" fill="${g.m.op >= 0 ? '#56633f' : '#8c491a'}" font-weight="500">利益 ${fmtK(g.m.op)}K · ${pct(g.m.op, g.m.rev)}</text>`);
  });
  const barTicksSvg = barTicks.map(t => `<g><line x1="92" x2="984" y1="${t.y}" y2="${t.y}" stroke="#dcd3c4" stroke-width="1"></line><text x="80" y="${t.ty}" text-anchor="end" font-size="13" fill="#82796a">${t.label}</text></g>`).join('');
  document.getElementById('bar-svg').innerHTML = barTicksSvg + barRectsSvg.join('') + barLabelsSvg.join('');
  document.getElementById('stack-caption').textContent = isAll ? curMonthLabel + ' 各店營收與支出結構，單位千元。' : '近 ' + series.length + ' 個月營收與支出結構，單位千元。';
  document.getElementById('stack-legend').innerHTML = [{ label: '營業收入', c: REV_COLOR }].concat(COST_KEYS.map(ck => ({ label: ck.label, c: ck.color })))
    .map(l => `<span style="display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;"><span style="${dot(l.c)}"></span>${l.label}</span>`).join('');

  // ---- trend chart ----
  const monthCount = MONTHS.length;
  document.getElementById('trend-title').textContent = '近 ' + monthCount + ' 個月走勢';
  const tSeries = isAll
    ? aggregateStores.map(s => ({ label: s.name, color: s.color, vals: SERIES[s.id].map(m => m.rev) }))
    : [{ label: '營業收入', color: store.color, vals: series.map(m => m.rev) }, { label: '營業利益', color: '#8fa073', vals: series.map(m => m.op) }];
  const tMax = Math.max(...tSeries.flatMap(s => s.vals), 1);
  const tt = niceTicks(tMax, 4);
  const tBase = 250, tTop = 22, tH = tBase - tTop;
  const ty = v => tBase - v / tt.top * tH;
  const tx = i => monthCount > 1 ? 100 + (880 / (monthCount - 1)) * i : 540;
  const trendTicksSvg = tt.vals.map(v => `<g><line x1="92" x2="984" y1="${ty(v)}" y2="${ty(v)}" stroke="#dcd3c4" stroke-width="1"></line><text x="80" y="${ty(v) + 4}" text-anchor="end" font-size="13" fill="#82796a">${fmtK(v)}K</text></g>`).join('');
  const trendLinesSvg = tSeries.map(s => `<polyline points="${s.vals.map((v, i) => tx(i) + ',' + ty(v)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>`).join('');
  const trendDotsSvg = tSeries.flatMap(s => s.vals.map((v, i) => `<circle cx="${tx(i)}" cy="${ty(v)}" r="4" fill="${s.color}"></circle>`)).join('');
  const trendXLabelsSvg = MONTHS.map((mo, i) => `<text x="${tx(i)}" y="278" text-anchor="middle" font-size="12.5" fill="#82796a">${mo} 月</text>`).join('');
  document.getElementById('trend-svg').innerHTML = trendTicksSvg + trendLinesSvg + trendDotsSvg + trendXLabelsSvg;
  document.getElementById('trend-caption').textContent = isAll ? '各店營收，單位千元。' : store.name + '營收與營業利益，單位千元。';
  document.getElementById('trend-legend').innerHTML = tSeries.map(s => `<span style="display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;"><span style="${dot(s.color)}"></span>${s.label}</span>`).join('');

  // ---- P&L table ----
  const rowDef = [{ key: 'rev', name: '營業收入', strong: true }, { key: 'material', name: '材料／進貨成本' }, { key: 'gross', name: '毛利', strong: true },
    { key: 'labor', name: '人事費用' }, { key: 'rent', name: '租金' }, { key: 'util', name: '水電雜支' }, { key: 'other', name: '其他營業費用' },
    { key: 'exp', name: '營業支出合計', strong: true }, { key: 'op', name: '營業利益', strong: true, hl: true }];
  if (cur.nonOp || prev.nonOp || ytd.nonOp) {
    rowDef.push({ key: 'nonOp', name: '股東分潤（股東往來，不計入營業費用）', note: true });
  }
  const pickVal = (m, key) => {
    if (key === 'rev') return m.rev;
    if (key === 'exp') return m.exp;
    if (key === 'op') return m.op;
    if (key === 'nonOp') return m.nonOp;
    if (key === 'gross') return m.rev - m.costs.material;
    return m.costs[key];
  };
  const cell = 'padding:15px 12px;text-align:right;border-bottom:1px solid #eee7db;';
  document.getElementById('table-body').innerHTML = rowDef.map(r => {
    const v = pickVal(cur, r.key);
    const nameStyle = 'padding:15px 12px;text-align:left;border-bottom:1px solid #eee7db;' + (r.strong ? 'font-weight:700;' : r.note ? 'color:#82796a;font-style:italic;font-size:13.5px;padding-left:28px;' : 'color:#474238;padding-left:28px;');
    const valStyle = cell + (r.hl ? 'font-weight:700;color:#8c491a;font-size:16px;' : r.note ? 'color:#82796a;font-style:italic;font-size:13.5px;' : r.strong ? 'font-weight:700;' : 'color:#474238;');
    const pctStyle = cell + 'color:#645c50;' + (r.note ? 'font-style:italic;font-size:13.5px;' : '');
    return `<tr>
      <td style="${nameStyle}">${r.name}</td>
      <td class="num" style="${valStyle}">${fmt(v)}</td>
      <td class="num" style="${pctStyle}">${pct(v, cur.rev)}</td>
      <td class="num" style="${pctStyle}">${fmt(pickVal(prev, r.key))}</td>
      <td class="num" style="${pctStyle}">${fmt(pickVal(ytd, r.key))}</td>
    </tr>`;
  }).join('');
  document.getElementById('table-caption').textContent = label + ' ' + curMonthLabel + '結，與上月及累計對照。';
}

function setMenuOpen(open) {
  document.querySelector('.sidebar').classList.toggle('open', open);
  document.getElementById('sidebar-overlay').classList.toggle('open', open);
}
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-scope]');
  if (navBtn) { state.scope = navBtn.dataset.scope; render(); setMenuOpen(false); return; }
  const perBtn = e.target.closest('[data-period-tab]');
  if (perBtn) {
    const val = perBtn.dataset.periodTab;
    if (val === 'ytd') { state.period = 'ytd'; }
    else { state.period = 'month'; state.monthIndex = parseInt(val.slice(1), 10); }
    render(); setMenuOpen(false); return;
  }
});
document.getElementById('btn-menu-open').addEventListener('click', () => setMenuOpen(true));
document.getElementById('btn-menu-close').addEventListener('click', () => setMenuOpen(false));
document.getElementById('sidebar-overlay').addEventListener('click', () => setMenuOpen(false));
document.getElementById('btn-print').addEventListener('click', () => window.print());

loadData().catch(err => {
  document.getElementById('kpi-grid').innerHTML = '<div style="color:#8c491a;">資料載入失敗，請確認 data.json 是否存在同一目錄：' + err.message + '</div>';
});
</script>
</body>
</html>
